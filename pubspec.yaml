name: lettuce_travel
description: Lettuce Travel - school & nursery bus transport safety app for admins, bus supervisors and parents.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management / DI / routing ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  # --- Models / immutability ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4        # live GPS pings (cheap, high-frequency writes)
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # --- Location & maps ---
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  flutter_background_service: ^5.0.10
  geodesy: ^0.10.2                   # distance helpers for stop geofencing

  # --- Local persistence / offline queue ---
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5

  # --- Notifications ---
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # --- UI ---
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # --- Utils ---
  logger: ^2.4.0
  collection: ^1.18.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  generate: true          # enables gen-l10n from lib/l10n/*.arb
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
