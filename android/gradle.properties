org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvm.options=-Xmx2G,-XX:MaxMetaspaceSize=1G
# Works around a Kotlin Gradle Plugin incremental-cache crash on Windows when the
# Pub package cache and the project live on different drive letters
# (RelocatableFileToPathConverter can't relativize across drive roots).
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
